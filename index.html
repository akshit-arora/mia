<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1d2b53">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>MIA: Animal Express</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="c" tabindex="0" role="application" aria-label="Animal Express game. Press Enter to pick up the animal, arrow keys to choose a place, Enter to drop."></canvas>
    <div id="cc" aria-hidden="true" hidden></div>
    <div id="hud">
      <button id="b-snd" type="button" class="hud-btn" aria-pressed="true" aria-label="Sound on"></button>
      <button id="b-cc" type="button" class="hud-btn" aria-label="Captions"><span aria-hidden="true">CC</span></button>
      <button id="b-par" type="button" class="hud-btn" aria-label="Grown-ups"><span class="ring" aria-hidden="true"></span><span aria-hidden="true">&#9881;</span></button>
    </div>
    <button id="go" type="button" class="go" aria-label="Go"><svg viewBox="0 0 24 16" aria-hidden="true"><rect x="1" y="5" width="13" height="7" fill="#ff7a2f" stroke="#181020"/><rect x="14" y="2" width="9" height="10" fill="#ff7a2f" stroke="#181020"/><circle cx="6" cy="13" r="2.5" fill="#181020"/><circle cx="19" cy="13" r="2.5" fill="#181020"/><circle cx="19" cy="6" r="2" fill="#fff" stroke="#181020"/></svg><span id="go-label">Go</span></button>
  </div>
  <div id="live" class="sr" role="status" aria-live="polite"></div>
  <div id="turn" hidden aria-live="polite"><svg viewBox="0 0 40 40" width="96" height="96" role="img" aria-label="Turn your phone sideways"><rect x="12" y="4" width="16" height="30" rx="3" fill="none" stroke="#fff" stroke-width="2"/><path d="M33 12a12 12 0 0 1 0 16m0 0l-4-1m4 1l1-4" fill="none" stroke="#ffd93d" stroke-width="2"/></svg></div>
  <noscript>Animal Express needs JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
